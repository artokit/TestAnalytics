configs:
  postgres_init:
    content: |
      CREATE DATABASE "users-service";
      CREATE DATABASE "payments-service";
      CREATE DATABASE "subscriptions-service";

services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql
    configs:
      - source: postgres_init
        target: /docker-entrypoint-initdb.d/10-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  users-service:
    build:
      context: ./backend
      dockerfile: users-service/Dockerfile
    image: users-service:latest
    container_name: users-service
    restart: unless-stopped
    environment:
      MOCK_ERROR_RATE_500: ${MOCK_ERROR_RATE_500:-0.05}
      MOCK_ERROR_RATE_429: ${MOCK_ERROR_RATE_429:-0.05}
      MOCK_RETRY_AFTER: ${MOCK_RETRY_AFTER:-5s}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  payments-service:
    build:
      context: ./backend
      dockerfile: payments-service/Dockerfile
    image: payments-service:latest
    container_name: payments-service
    restart: unless-stopped
    environment:
      MOCK_ERROR_RATE_500: ${MOCK_ERROR_RATE_500:-0.05}
      MOCK_ERROR_RATE_429: ${MOCK_ERROR_RATE_429:-0.05}
      MOCK_RETRY_AFTER: ${MOCK_RETRY_AFTER:-5s}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  subscriptions-service:
    build:
      context: ./backend
      dockerfile: subscriptions-service/Dockerfile
    image: subscriptions-service:latest
    container_name: subscriptions-service
    restart: unless-stopped
    environment:
      MOCK_ERROR_RATE_500: ${MOCK_ERROR_RATE_500:-0.05}
      MOCK_ERROR_RATE_429: ${MOCK_ERROR_RATE_429:-0.05}
      MOCK_RETRY_AFTER: ${MOCK_RETRY_AFTER:-5s}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  analytics-service:
    build:
      context: ./backend
      dockerfile: analytics-service/Dockerfile
    image: analytics-service:latest
    container_name: analytics-service
    restart: unless-stopped
    environment:
      SYNC_INTERVAL: ${SYNC_INTERVAL:-10m}
    ports:
      - "8004:80"
    depends_on:
      redis:
        condition: service_healthy
      users-service:
        condition: service_healthy
      payments-service:
        condition: service_healthy
      subscriptions-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    image: node:20-alpine
    container_name: frontend
    restart: unless-stopped
    working_dir: /app
    environment:
      API_PROXY_TARGET: http://analytics-service:80
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install >/dev/null 2>&1 && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      analytics-service:
        condition: service_healthy

  seeder:
    build:
      context: ./backend
      dockerfile: seeder-service/Dockerfile
    image: seeder-service:latest
    restart: "no"
    environment:
      SEED: ${SEED:-42}
      SEED_USERS: ${SEED_USERS:-10000}
      SEED_BATCH_SIZE: ${SEED_BATCH_SIZE:-500}
      FORCE: ${FORCE:-0}
      DATABASE_DSN: user=postgres password=postgres host=postgres port=5432 dbname=users-service sslmode=disable
      DATABASE_DSN_SUBSCRIPTIONS: user=postgres password=postgres host=postgres port=5432 dbname=subscriptions-service sslmode=disable
      DATABASE_DSN_PAYMENTS: user=postgres password=postgres host=postgres port=5432 dbname=payments-service sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      users-service:
        condition: service_healthy
      payments-service:
        condition: service_healthy
      subscriptions-service:
        condition: service_healthy

volumes:
  postgres_data:
  frontend_node_modules:
