name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: golangci-lint (analytics-service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/analytics-service/go.mod
          cache-dependency-path: backend/**/go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          working-directory: backend/analytics-service
          version: latest

  test:
    name: go test -race (analytics-service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/analytics-service/go.mod
          cache-dependency-path: backend/analytics-service/go.sum

      - name: Test
        working-directory: backend/analytics-service
        run: go test -race ./...

  compose:
    name: docker compose up --build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start
        run: docker compose up --build -d

      - name: Wait for analytics healthcheck
        run: |
          cid=$(docker compose ps -q analytics-service)
          for i in $(seq 1 60); do
            st=$(docker inspect -f '{{.State.Health.Status}}' "$cid")
            echo "analytics health: $st"
            if [ "$st" = "healthy" ]; then exit 0; fi
            if [ "$st" = "unhealthy" ]; then docker compose logs analytics-service; exit 1; fi
            sleep 5
          done
          echo "analytics did not become healthy in time"
          docker compose logs analytics-service
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  deploy:
    name: deploy to test server
    needs: [lint, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    env:
      DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT || 22 }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            cd $DEPLOY_DIR
            git fetch origin --prune
            git reset --hard origin/${{ github.ref_name }}
            docker compose up --build -d
            cid=$(docker compose ps -q analytics-service)
            for i in $(seq 1 60); do
              st=$(docker inspect -f '{{.State.Health.Status}}' "$cid")
              echo "analytics health: $st"
              if [ "$st" = "healthy" ]; then break; fi
              if [ "$st" = "unhealthy" ]; then docker compose logs analytics-service; exit 1; fi
              sleep 5
            done
            if [ "$st" != "healthy" ]; then
              docker compose logs analytics-service
              exit 1
            fi
            docker image prune -f
            docker compose ps
