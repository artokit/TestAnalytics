name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: golangci-lint (analytics-service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/analytics-service/go.mod
          cache-dependency-path: backend/**/go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          working-directory: backend/analytics-service
          version: latest

  test:
    name: go test -race (analytics-service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/analytics-service/go.mod
          cache-dependency-path: backend/analytics-service/go.sum

      - name: Test
        working-directory: backend/analytics-service
        run: go test -race ./...

  compose:
    name: docker compose up --build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start
        run: docker compose up --build -d

      - name: Wait for analytics healthcheck
        run: |
          cid=$(docker compose ps -q analytics-service)
          for i in $(seq 1 60); do
            st=$(docker inspect -f '{{.State.Health.Status}}' "$cid")
            echo "analytics health: $st"
            if [ "$st" = "healthy" ]; then exit 0; fi
            if [ "$st" = "unhealthy" ]; then docker compose logs analytics-service; exit 1; fi
            sleep 5
          done
          echo "analytics did not become healthy in time"
          docker compose logs analytics-service
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  deploy:
    name: deploy to test server
    needs: [lint, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Pack repository
        run: git archive --format=tar -o /tmp/deploy.tar HEAD

      - name: Deploy files and start stack
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          sshpass -p "$SSH_PASSWORD" scp -o StrictHostKeyChecking=no -P "$SSH_PORT" /tmp/deploy.tar "$SSH_USER@$SSH_HOST:/tmp/deploy.tar"

          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "SERVER_DIR='$SSH_DEPLOY_DIR' bash -s" <<'REMOTE'
          set -e
          mkdir -p "$SERVER_DIR"
          tar xf /tmp/deploy.tar -C "$SERVER_DIR"
          cd "$SERVER_DIR"
          if ! docker compose version >/dev/null 2>&1; then
            echo "installing docker compose plugin"
            mkdir -p ~/.docker/cli-plugins
            curl -fsSL -o ~/.docker/cli-plugins/docker-compose https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64
            chmod +x ~/.docker/cli-plugins/docker-compose
            docker compose version
          fi
          export DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1
          docker compose up --build -d
          cid=$(docker compose ps -q analytics-service)
          for i in $(seq 1 60); do
            st=$(docker inspect -f '{{.State.Health.Status}}' "$cid")
            echo "analytics health: $st"
            if [ "$st" = "healthy" ]; then break; fi
            if [ "$st" = "unhealthy" ]; then docker compose logs analytics-service; exit 1; fi
            sleep 5
          done
          if [ "$st" != "healthy" ]; then
            docker compose logs analytics-service
            exit 1
          fi
          docker image prune -f
          docker compose ps
          REMOTE
