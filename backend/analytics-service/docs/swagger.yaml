basePath: /
definitions:
  analytics-service_internal_handlers_response.LtvByPlanResponse:
    properties:
      data_as_of:
        type: string
      plans:
        items:
          $ref: '#/definitions/analytics-service_internal_handlers_response.PlanLtv'
        type: array
    type: object
  analytics-service_internal_handlers_response.LtvSummaryMetrics:
    properties:
      avg_ltv:
        type: integer
      median_ltv:
        type: integer
      total_revenue:
        type: integer
      users:
        type: integer
    type: object
  analytics-service_internal_handlers_response.LtvSummaryResponse:
    properties:
      data_as_of:
        type: string
      metrics:
        $ref: '#/definitions/analytics-service_internal_handlers_response.LtvSummaryMetrics'
    type: object
  analytics-service_internal_handlers_response.PlanLtv:
    properties:
      avg_ltv:
        type: integer
      plan_id:
        type: integer
      total_revenue:
        type: integer
      users:
        type: integer
    type: object
  analytics-service_internal_handlers_response.RetentionPeriod:
    properties:
      cumulative_rate:
        type: number
      eligible:
        type: integer
      period:
        type: integer
      rate:
        type: number
      renewed:
        type: integer
    type: object
  analytics-service_internal_handlers_response.RetentionResponse:
    properties:
      cohort_size:
        type: integer
      data_as_of:
        type: string
      periods:
        items:
          $ref: '#/definitions/analytics-service_internal_handlers_response.RetentionPeriod'
        type: array
      plan_id:
        type: integer
    type: object
  analytics-service_internal_handlers_response.StatusResponse:
    properties:
      last_poll:
        type: string
      last_sync_err:
        type: string
      next_poll:
        type: string
      ready:
        type: boolean
    type: object
  analytics-service_internal_handlers_response.UserLtvResponse:
    properties:
      current_status:
        type: string
      first_plan_id:
        type: integer
      ltv:
        type: integer
      payments_count:
        type: integer
      telegram_id:
        type: integer
      user_id:
        type: string
    type: object
  httputil.ErrorResponse:
    properties:
      error:
        type: string
    type: object
info:
  contact: {}
  description: REST API сервиса аналитики.
  title: Analytics Service API
  version: "1.0"
paths:
  /metrics/ltv/by-plan:
    get:
      description: Средний LTV, число пользователей и выручка по тарифам первой подписки
        когорты. from/to фильтруют когорту по дате первой подписки (RFC3339)
      parameters:
      - description: Начало когорты (RFC3339)
        in: query
        name: from
        type: string
      - description: Конец когорты (RFC3339)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/analytics-service_internal_handlers_response.LtvByPlanResponse'
        "304":
          description: Not Modified
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "503":
          description: снимок ещё не собран
          schema:
            type: string
      summary: LTV по тарифу первой подписки
  /metrics/ltv/summary:
    get:
      description: Среднее, медиана, общая выручка и число пользователей когорты.
        from/to фильтруют когорту по дате первой подписки (RFC3339)
      parameters:
      - description: Начало когорты (RFC3339)
        in: query
        name: from
        type: string
      - description: Конец когорты (RFC3339)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/analytics-service_internal_handlers_response.LtvSummaryResponse'
        "304":
          description: Not Modified
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "503":
          description: снимок ещё не собран
          schema:
            type: string
      summary: Общий LTV по всем пользователям
  /metrics/retention:
    get:
      description: Условные и кумулятивные доли продлений по периодам (когорта - пользователи
        с первой подпиской на указанный тариф). from/to фильтруют когорту по дате
        первой подписки
      parameters:
      - description: Идентификатор тарифа
        in: query
        name: plan_id
        required: true
        type: integer
      - default: 12
        description: Максимальное число периодов (по умолчанию 12)
        in: query
        minimum: 1
        name: max_periods
        type: integer
      - description: Начало когорты (RFC3339)
        in: query
        name: from
        type: string
      - description: Конец когорты (RFC3339)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/analytics-service_internal_handlers_response.RetentionResponse'
        "304":
          description: Not Modified
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "404":
          description: нет данных для тарифа
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "503":
          description: снимок ещё не собран
          schema:
            type: string
      summary: Процент продлений по периодам для тарифа
  /status:
    get:
      description: Время последнего успешного опроса источников, время следующего
        опроса и последняя ошибка синхронизации, если была
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/analytics-service_internal_handlers_response.StatusResponse'
      summary: Статус синхронизации
      tags:
      - system
  /users/by-telegram/{telegram_id}/ltv:
    get:
      description: 'Пользователь: id, тариф первой подписки, LTV, число платежей и
        текущий статус подписки. Данные берутся из последнего снимка'
      parameters:
      - description: Telegram ID пользователя
        in: path
        name: telegram_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/analytics-service_internal_handlers_response.UserLtvResponse'
        "304":
          description: Not Modified
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "503":
          description: снимок ещё не собран
          schema:
            type: string
      summary: LTV пользователя по telegram_id
schemes:
- http
swagger: "2.0"
